name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Version smoke test
        run: .build/debug/spotlight-wallpaper --version
      - name: Fetch smoke test
        run: .build/debug/spotlight-wallpaper --fetch-once
      - name: Build app bundle
        run: scripts/build-app.sh
      - name: App bundle smoke test
        run: |
          ".build/Spotlight Wallpaper.app/Contents/MacOS/spotlight-wallpaper" --version
